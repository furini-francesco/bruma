replicaCount: 1

image:
  repository: bruma/demo-api
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources: {}

ingress:
  enabled: false
  host: ""
  path: /
  pathType: Prefix

observability:
  enabled: true
  metricsPath: /metrics

autoscaling: {}