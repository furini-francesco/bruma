apiVersion: bruma.io/v1
kind: Workload
metadata:
  name: demo-api
  environment: local
spec:
  image: bruma/demo-api:latest
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  ingress:
    enabled: true
    host: demo.local
  observability:
    enabled: true