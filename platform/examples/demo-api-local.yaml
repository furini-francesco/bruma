apiVersion: v1
kind: Namespace
metadata:
  name: bruma-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: bruma-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      containers:
        - name: demo-api
          image: bruma/demo-api:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: bruma-demo
spec:
  selector:
    app: demo-api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
